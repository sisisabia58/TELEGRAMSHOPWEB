name: Test

on:
  pull_request:
  push:
    branches:
      - phase13-multi-supplier-sourcing
      - phase14-flow-builder-ux

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # package.json has no engines field; use current Node LTS
          node-version: lts/*
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
        env:
          SUPABASE_URL: http://localhost
          SUPABASE_KEY: dummy
